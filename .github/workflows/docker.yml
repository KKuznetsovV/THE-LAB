name: images

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kuzmass/thelab-frontend
            file: frontend/Dockerfile
          - image: kuzmass/thelab-identity-service
            file: identity-service/Dockerfile
          - image: kuzmass/thelab-content-service
            file: content-service/Dockerfile
          - image: kuzmass/thelab-media-service
            file: media-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Decide whether to push
        id: push
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Frontend build args
        id: args
        run: |
          if [ "${{ matrix.file }}" = "frontend/Dockerfile" ] && [ "${{ steps.push.outputs.enabled }}" = "true" ]; then
            {
              echo "value<<EOF"
              echo "BUILD_SCRIPT=build:production"
              echo "SKIP_PRERENDER=0"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.file }}" = "frontend/Dockerfile" ]; then
            {
              echo "value<<EOF"
              echo "BUILD_SCRIPT=build:docker"
              echo "SKIP_PRERENDER=0"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ steps.push.outputs.enabled == 'true' }}
          tags: ${{ matrix.image }}:latest
          build-args: ${{ steps.args.outputs.value }}
