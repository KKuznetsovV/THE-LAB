# Old WordPress paths (docs/CONTENT.md §7). $request_uri keeps the raw request,
# so both percent-encoded Hebrew and a literal Hebrew path match.
map $request_uri $old_path {
  default "";
  ~*^/%D7%AA%D7%A4%D7%A8%D7%99%D7%98/?(\?|$) /menu;
  ~*^/תפריט/?(\?|$) /menu;
  ~*^/%D7%90%D7%95%D7%93%D7%95%D7%AA/?(\?|$) /about;
  ~*^/אודות/?(\?|$) /about;
  ~*^/%D7%94%D7%A1%D7%99%D7%A4%D7%95%D7%A8-%D7%A9%D7%9C%D7%A0%D7%95/?(\?|$) /about;
  ~*^/הסיפור-שלנו/?(\?|$) /about;
  ~*^/%D7%92%D7%9C%D7%A8%D7%99%D7%94/?(\?|$) /archive;
  ~*^/גלריה/?(\?|$) /archive;
  ~*^/%D7%A6%D7%95%D7%A8-%D7%A7%D7%A9%D7%A8/?(\?|$) /visit;
  ~*^/צור-קשר/?(\?|$) /visit;
  ~*^/%D7%94%D7%A6%D7%94%D7%A8%D7%AA-%D7%A0%D7%92%D7%99%D7%A9%D7%95%D7%AA/?(\?|$) /accessibility;
  ~*^/הצהרת-נגישות/?(\?|$) /accessibility;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80 default_server;
  server_name _;

  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml text/xml;

  resolver 127.0.0.11 valid=10s ipv6=off;

  if ($old_path != "") {
    return 301 $old_path;
  }

  root /usr/share/nginx/html;
  index index.html;

  location /api/auth {
    set $upstream http://identity-service:3110;
    proxy_pass $upstream;
    include /etc/nginx/proxy.conf;
  }

  location /api/admins {
    set $upstream http://identity-service:3110;
    proxy_pass $upstream;
    include /etc/nginx/proxy.conf;
  }

  location /api/cocktails {
    set $upstream http://content-service:3109;
    proxy_pass $upstream;
    include /etc/nginx/proxy.conf;
  }

  location /api/bottles {
    set $upstream http://content-service:3109;
    proxy_pass $upstream;
    include /etc/nginx/proxy.conf;
  }

  location /api/spirits {
    set $upstream http://content-service:3109;
    proxy_pass $upstream;
    include /etc/nginx/proxy.conf;
  }

  location /api/events {
    set $upstream http://content-service:3109;
    proxy_pass $upstream;
    include /etc/nginx/proxy.conf;
  }

  location /api/gallery {
    set $upstream http://content-service:3109;
    proxy_pass $upstream;
    include /etc/nginx/proxy.conf;
  }

  location /api/hours {
    set $upstream http://content-service:3109;
    proxy_pass $upstream;
    include /etc/nginx/proxy.conf;
  }

  location /api/settings {
    set $upstream http://content-service:3109;
    proxy_pass $upstream;
    include /etc/nginx/proxy.conf;
  }

  location /api/health {
    set $upstream http://content-service:3109;
    proxy_pass $upstream;
    include /etc/nginx/proxy.conf;
  }

  location /api/uploads {
    client_max_body_size 8m;
    set $upstream http://media-service:3106;
    proxy_pass $upstream;
    include /etc/nginx/proxy.conf;
  }

  location /api/ {
    include /etc/nginx/security-headers.conf;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 404 '{"status":404,"message":"not found"}';
  }

  location /media/ {
    set $upstream http://minio:9000;
    rewrite ^/media/(.*)$ /thelab-media/$1 break;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host minio:9000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    limit_except GET HEAD { deny all; }
  }

  location = /favicon.ico {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files /brand/logo/the-lab-logo-stacked-green.svg =404;
    default_type image/svg+xml;
  }

  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /brand/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location /og/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location = /robots.txt {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html /index.html;
  }
}

server {
  listen 80;
  server_name 7to1lab.com www.7to1lab.com;

  if ($old_path != "") {
    return 301 https://thelabtlv.com$old_path;
  }

  return 301 https://thelabtlv.com$request_uri;
}
