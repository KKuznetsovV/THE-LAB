services:
  database:
    build: ./db
    environment:
      MYSQL_ROOT_PASSWORD: thelab
    ports:
      - "3307:3306"
    volumes:
      - thelab-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pthelab", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-thelab}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    ports:
      - "9200:9000"
      - "9201:9001"
    volumes:
      - thelab-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  thelab-mysql:
  thelab-minio:
