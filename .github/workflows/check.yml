name: build-gate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build gate
        run: node scripts/check.mjs
        env:
          CI: 'true'
          SKIP_PRERENDER: '1'
